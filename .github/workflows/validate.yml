name: Validate Mock-up PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-and-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check video-library.js
          node --check service-worker.js
      - name: Mocked local video library tests
        run: node --test tests/video-library.test.cjs
